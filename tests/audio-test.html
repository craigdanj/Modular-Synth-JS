<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modular Synth JS — Audio tests</title><style>body{font:16px/1.6 system-ui;background:#101719;color:#e7efea;max-width:850px;margin:40px auto;padding:20px}button{padding:12px 20px;background:#82d7c0;border:0;border-radius:6px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;background:#182225;padding:20px;border-radius:8px}</style><h1>Browser audio tests</h1><p>Renders real Web Audio graphs with OfflineAudioContext. No speakers are needed.</p><button id="run">Run audio tests</button><pre id="result" role="status">Ready.</pre><script src="../modular-synth.js"></script><script>
const report=document.getElementById('result');
function check(condition,label){if(!condition)throw new Error(label);}
async function render(build,seconds=1){const context=new OfflineAudioContext(1,Math.ceil(seconds*48000),48000);const synth=new ModularSynth({context});build(synth,context);const buffer=await context.startRendering();await synth.destroy();return buffer.getChannelData(0);}
function rms(data,start,end){const a=Math.floor(start*48000),b=Math.floor(end*48000);let power=0;for(let i=a;i<b;i++)power+=data[i]*data[i];return Math.sqrt(power/(b-a));}
document.getElementById('run').onclick=async()=>{const lines=[];report.textContent='Rendering…';const tests=[
['Oscillator → VCA → output produces audio and releases to silence',async()=>{const data=await render(s=>{s.create('oscillator',{wave:'sine',level:.5},'osc');s.create('vca',{},'amp');s.create('envelope',{attack:.01,decay:.05,sustain:.6,release:.1},'env');s.create('output',{volume:.5},'out');s.connect('osc','out','amp','in');s.connect('env','out','amp','gain');s.connect('amp','out','out','in');s.noteOn(69,.05);s.noteOff(69,.5);});check(rms(data,.2,.4)>.04,'Expected audible sustained output');check(rms(data,.8,.95)<1e-5,'Expected silence after release');check([...data].every(Number.isFinite),'Non-finite audio sample');}],
['Envelope release during attack keeps a continuous ramp',async()=>{const data=await render((s,c)=>{const m=s.create('envelope',{attack:.2,decay:.1,sustain:.5,release:.2},'env');m.outputs.out.connect(c.destination);s.noteOn(60,.1);s.noteOff(60,.2);},.6);check(Math.abs(data[Math.floor(.15*48000)]-.25)<.005,'Attack was lost when release was scheduled');check(Math.abs(data[Math.floor(.3*48000)]-.25)<.005,'Incorrect interrupted release');check(rms(data,.45,.55)<1e-5,'Envelope should end at zero');}],
['Bipolar LFO has the requested frequency and depth',async()=>{const data=await render((s,c)=>{s.create('lfo',{rate:5,depth:.5},'lfo').outputs.out.connect(c.destination);});check(Math.abs(rms(data,.1,.9)-.5/Math.sqrt(2))<.005,'Incorrect LFO RMS');let rises=0;for(let i=1;i<data.length;i++)if(data[i-1]<0&&data[i]>=0)rises++;check(rises>=4&&rises<=5,'Incorrect LFO frequency');}],
['Delay produces an echo at its configured time',async()=>{const data=await render((s,c)=>{const delay=s.create('delay',{time:.2,feedback:0,mix:1},'delay');const src=c.createBufferSource(),b=c.createBuffer(1,480,48000);b.getChannelData(0).fill(.5);src.buffer=b;src.connect(delay.inputs.in);delay.outputs.out.connect(c.destination);src.start(.05);});check(rms(data,.05,.06)<1e-5,'Unexpected dry signal');check(rms(data,.25,.26)>.45,'Missing timed echo');}],
['Retrigger during release preserves the current envelope level',async()=>{const data=await render((s,c)=>{const m=s.create('envelope',{attack:.1,decay:.1,sustain:.5,release:.2},'env');m.outputs.out.connect(c.destination);s.noteOn(60,.05);s.noteOff(60,.35);s.noteOn(62,.45);s.noteOff(62,.7);});check(Math.abs(data[Math.floor(.45*48000)]-.25)<.005,'Retrigger level is discontinuous');check(Math.abs(data[Math.floor(.5*48000)]-.625)<.01,'Retrigger attack slope is wrong');check(rms(data,.95,.99)<1e-5,'Expected silence after final release');}],
['New delay mix automation cancels an older future change',async()=>{const data=await render((s,c)=>{const m=s.create('delay',{time:.1,feedback:0,mix:0},'echo');const src=c.createConstantSource();src.offset.value=.5;src.connect(m.inputs.in);m.outputs.out.connect(c.destination);src.start(.05);src.stop(.3);s.set('echo','mix',1,.2);s.set('echo','mix',0,.1);});check(rms(data,.35,.39)<1e-5,'An obsolete future wet-mix change was not cancelled');}],
['Noise, filter and mixer produce finite audio',async()=>{const data=await render(s=>{s.create('noise',{},'n');s.create('filter',{},'f');s.create('mixer',{},'mix');s.create('output',{},'out');s.connect('n','out','f','in');s.connect('f','out','mix','a');s.connect('mix','out','out','in');});check(rms(data,.2,.8)>.001,'Expected filtered noise');check([...data].every(Number.isFinite),'Non-finite sample');}]
];for(const [label,test] of tests){try{await test();lines.push('PASS  '+label);}catch(e){lines.push('FAIL  '+label+'\n      '+e.message);}report.textContent=lines.join('\n');}report.textContent+='\n\n'+lines.filter(x=>x.startsWith('PASS')).length+'/'+tests.length+' passed.';};
</script></html>
